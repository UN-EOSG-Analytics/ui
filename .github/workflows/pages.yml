name: Deploy Storybook to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; `contents: read` is enough because we deploy an artifact
# rather than pushing to a gh-pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's `packageManager` field
      # already pins pnpm, and specifying both makes the action error out.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Storybook
        # `base_path` is "/ui" for a project site, "" for a user/org site —
        # Vite wants a trailing slash either way.
        run: pnpm build-storybook
        env:
          STORYBOOK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
